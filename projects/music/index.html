<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1c20" />
    <meta name="description" content="Music by Sam Deddeh. Listen and follow the lyrics." />
    <title>Music · Deddeh.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#room">Skip to the page</a>
    <div class="stage" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="shell">
      <header class="top">
        <a class="identity" href="../../" aria-label="deddeh.com, home">deddeh.com<span class="caret" aria-hidden="true"></span></a>
        <a class="return" href="../../#projects" data-leave><span aria-hidden="true">←</span> <b>Projects</b></a>
        <p class="marks" aria-hidden="true"><span data-mark="writing"></span><span data-mark="projects" class="is-on"></span><span data-mark="contact"></span></p>
      </header>

      <main class="music-collection" id="room" data-view="shelf" data-tone="music" data-formation="music" tabindex="-1">
        <header class="music-heading">
          <p class="music-kicker">Sam Deddeh <span aria-hidden="true">/</span> Recordings</p>
          <h1>Music<span class="music-period" aria-hidden="true">.</span></h1>
          <p class="music-intro">Sound, given time.</p>
        </header>

        <div class="sheet-slot" aria-hidden="true"></div>
        <p class="figure"><span class="figure-caption" aria-hidden="true"><span class="figure-no">01</span><span class="figure-text">Sweet on My Tongue</span></span></p>

        <section class="recordings" aria-label="Recordings">
          <div class="recordings-label"><span>Recordings</span><span class="recording-count">01</span></div>
          <!-- One entry per real recording. The selected entry supplies the full-size sculpture. -->
          <ol class="setlist">
            <li><a class="entry" href="./sweet-on-my-tongue/" data-room data-analysis="../../music/sweet-on-my-tongue.analysis.json"><span class="entry-no" aria-hidden="true">01</span><span class="entry-name">Sweet on My Tongue</span><span class="entry-time">3:26</span><span class="entry-invitation">Listen <span class="diagonal-arrow" aria-hidden="true"></span></span></a></li>
          </ol>
        </section>
        <footer class="music-foot"><p>A little time. A closer listen.</p><a href="../apps/" data-room>Explore Apps <span class="diagonal-arrow" aria-hidden="true"></span></a></footer>
      </main>

    </div>
    <script type="module" src="/src/projects.js"></script>
  </body>
</html>
