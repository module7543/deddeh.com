<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141311" />
    <meta name="description" content="Music by Sam Deddeh. Listen and follow the lyrics." />
    <title>Music · Deddeh.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#room">Skip to the page</a>
    <div class="stage" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="shell">
      <header class="top">
        <a class="identity" href="../../" aria-label="deddeh.com, home">deddeh.com<span class="caret" aria-hidden="true"></span></a>
        <a class="return" href="../../#projects" data-leave><span aria-hidden="true">←</span> <b>Projects</b></a>
        <p class="marks" aria-hidden="true"><span data-mark="writing"></span><span data-mark="projects" class="is-on"></span><span data-mark="contact"></span></p>
      </header>

      <main id="room" data-view="shelf" data-tone="music" data-formation="music" tabindex="-1">
        <h1 class="sr-only">Music, a collection in Projects</h1>

        <div class="lede">
          <span class="lede-bar" aria-hidden="true"></span>
          <p class="statement">Songs, to listen to here.</p>
        </div>

        <div class="sheet-slot" aria-hidden="true"></div>

        <!-- The collections. To add one: a word here on every collection page, a folder under projects/, and a row on the homepage. -->
        <nav class="toc rooms" aria-label="Collections">
          <ol>
            <li>
              <a class="toc-item" href="../apps/" data-room><span class="num" aria-hidden="true">2a</span><span class="word"><span class="word-text">Apps</span></span></a>
            </li>
            <li>
              <a class="toc-item is-active" aria-current="page" href="./" data-room><span class="num" aria-hidden="true">2b</span><span class="word"><span class="word-text">Music</span></span></a>
              <!-- One row per track, in the order they should be heard. -->
              <div class="shelf">
                <ol class="setlist">
                  <li><a class="entry" href="./sweet-on-my-tongue/" data-room><span class="entry-no" aria-hidden="true">01</span><span class="entry-name">Sweet on My Tongue</span><span class="entry-time">3:26</span></a></li>
                </ol>
              </div>
            </li>
          </ol>
        </nav>

        <p class="figure"><span class="figure-caption" aria-hidden="true"><span class="figure-no">Fig. 2b</span><span class="figure-text">The sheet, set as a score.</span></span></p>
      </main>

    </div>
    <script type="module" src="/src/projects.js"></script>
  </body>
</html>
