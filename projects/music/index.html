<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141311" />
    <meta name="description" content="Music by Sam Deddeh. Listen and follow the lyrics." />
    <title>Music · Deddeh.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#room">Skip to the page</a>
    <div class="stage" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>
    <div class="shell">
      <header class="top">
        <a class="identity" href="../../" aria-label="deddeh.com, home">deddeh.com<span class="caret" aria-hidden="true"></span></a>
        <a class="return" href="../../#projects" data-leave><span aria-hidden="true">←</span> <b>Projects</b></a>
        <p class="marks" aria-hidden="true"><span data-mark="writing"></span><span data-mark="projects" class="is-on"></span><span data-mark="contact"></span></p>
      </header>

      <main id="room" class="music-collection" data-view="shelf" data-tone="music" data-formation="music" tabindex="-1">
        <header class="music-heading">
          <p class="music-kicker"><span>Sam Deddeh</span><span>Recordings / 2b</span></p>
          <h1>Music<span class="music-period">.</span></h1>
          <p class="music-intro">Something to spend time with.</p>
        </header>

        <div class="sheet-slot" aria-hidden="true"></div>

        <section class="music-catalog" aria-labelledby="recordings-label">
          <div class="catalog-heading"><h2 id="recordings-label">The recordings</h2><span>Choose a song to listen</span></div>
          <!-- One entry per recording. The order also supplies previous / next navigation. -->
          <ol class="setlist">
            <li><a class="entry" href="./sweet-on-my-tongue/" data-room data-analysis="../../music/sweet-on-my-tongue.analysis.json"><span class="entry-no" aria-hidden="true">01</span><span class="entry-name">Sweet on My Tongue</span><span class="entry-time">3:26</span><span class="entry-go" aria-hidden="true">↗</span><span class="entry-invitation" aria-hidden="true">Listen &amp; follow the lyrics</span></a></li>
          </ol>
        </section>

        <footer class="music-foot">
          <p class="figure"><span class="figure-caption" aria-hidden="true"><span class="figure-no">Fig. 2b</span><span class="figure-text">A study in sound.</span></span></p>
          <a href="../apps/" data-room class="music-sibling">Elsewhere / Apps <span aria-hidden="true">↗</span></a>
        </footer>
      </main>

    </div>
    <script type="module" src="/src/projects.js"></script>
  </body>
</html>
