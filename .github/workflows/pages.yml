name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Test interactions
        run: npm test
      - name: Build for the repository Pages path
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium for the public preview check
        run: npx playwright install --with-deps chromium
      - name: Verify the deployed public website
        run: npm run verify:pages
        env:
          PREVIEW_URL: ${{ needs.deploy.outputs.page_url }}
      - name: Save desktop and mobile browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-browser-verification
          path: artifacts/pages-*.png
          if-no-files-found: ignore
