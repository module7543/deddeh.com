name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: PR validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build for the repository Pages path
        run: npm run build:pages
